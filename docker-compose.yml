services:
  pzw:
    build: .
    container_name: pzw
    restart: unless-stopped
    environment:
      FLASK_APP: run.py
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: mysql+pymysql://${DB_USER}:${DB_PASSWORD}@mariadb:3306/${DB_NAME}
    volumes:
      - ./logs:/app/logs
    networks:
      - proxy
      - db_network

networks:
  proxy:
    name: proxy
    external: true
  db_network:
    name: db_network
    external: true
