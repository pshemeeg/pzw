{% extends "base.html" %}

{% block title %}Logowanie{% endblock %}
{% block page_title %}Logowanie{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center p-4">
    <div class="w-full max-w-lg">
        <div class="bg-white dark:bg-gray-800 rounded-[2.5rem] shadow-2xl shadow-water-500/10 border border-water-100 dark:border-gray-700 overflow-hidden">
            <div class="p-8 md:p-12">
                <div class="text-center mb-10">
                    <div class="relative inline-block mb-6">
                        <img src="{{ url_for('static', filename='img/logo.png') }}"
                             alt="Logo PZW" class="h-24 w-24 rounded-3xl shadow-xl rotate-3 hover:rotate-0 transition-transform duration-500">
                        <div class="absolute -bottom-2 -right-2 w-8 h-8 bg-gold-500 rounded-full border-4 border-white dark:border-gray-800 flex items-center justify-center">
                            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                        </div>
                    </div>
                    <h1 class="text-3xl font-black text-gray-900 dark:text-white uppercase tracking-tighter mb-2">
                        Witaj <span class="text-water-500">ponownie</span>
                    </h1>
                    <p class="text-sm font-medium text-gray-400 dark:text-gray-500 uppercase tracking-widest">
                        Zaloguj się do panelu sędziego
                    </p>
                </div>

                <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-6">
                    <div class="space-y-2">
                        <label for="email" class="block text-[10px] font-black uppercase tracking-[0.2em] text-gray-400 ml-1">Adres Email</label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-300 group-focus-within:text-water-500 transition-colors">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.206"/></svg>
                            </div>
                            <input type="email" id="email" name="email" required autocomplete="email"
                                   class="w-full pl-12 pr-4 py-4 text-base font-bold rounded-2xl border border-water-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-900/50 text-gray-900 dark:text-white outline-none focus:border-water-500 transition-all shadow-inner">
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label for="haslo" class="block text-[10px] font-black uppercase tracking-[0.2em] text-gray-400 ml-1">Hasło dostępu</label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-300 group-focus-within:text-water-500 transition-colors">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                            </div>
                            <input type="password" id="haslo" name="haslo" required autocomplete="current-password"
                                   class="w-full pl-12 pr-4 py-4 text-base font-bold rounded-2xl border border-water-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-900/50 text-gray-900 dark:text-white outline-none focus:border-water-500 transition-all shadow-inner">
                        </div>
                    </div>

                    <button type="submit"
                            class="w-full py-5 bg-gold-500 hover:bg-gold-600 text-white font-black uppercase tracking-[0.2em] rounded-2xl transition-all shadow-xl shadow-gold-500/20 active:scale-[0.98] mt-4">
                        Zaloguj się
                    </button>
                </form>
            </div>
            <div class="px-8 py-6 bg-gray-50 dark:bg-gray-900/50 border-t border-water-50 dark:border-gray-700 text-center">
                <p class="text-[10px] font-black uppercase tracking-widest text-gray-400">
                    Polski Związek Wędkarski — System Obsługi Zawodów
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
