{% extends "base.html" %} {% block title %}Logowanie{% endblock %} {% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <img
        src="{{ url_for('static', filename='img/logo.png') }}"
        alt="Logo PZW"
        class="h-24 w-24 rounded-full mx-auto mb-4 shadow-md"
      />
      <h1 class="text-2xl font-semibold text-water-700 dark:text-water-200">
        System Zawodów PZW
      </h1>
      <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">
        Zaloguj się aby kontynuować
      </p>
    </div>

    <div
      class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-8 border border-water-200 dark:border-gray-700"
    >
      <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-5">
        <div>
          <label
            for="email"
            class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
          >
            Email
          </label>
          <input
            type="email"
            id="email"
            name="email"
            required
            autocomplete="email"
            class="w-full px-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-water-500 focus:border-transparent transition-colors duration-150"
          />
        </div>

        <div>
          <label
            for="haslo"
            class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
          >
            Hasło
          </label>
          <input
            type="password"
            id="haslo"
            name="haslo"
            required
            autocomplete="current-password"
            class="w-full px-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-water-500 focus:border-transparent transition-colors duration-150"
          />
        </div>

        <button
          type="submit"
          class="w-full py-2.5 px-4 bg-gold-500 hover:bg-gold-600 text-white font-medium rounded-lg transition-colors duration-150 shadow-sm"
        >
          Zaloguj się
        </button>
      </form>
    </div>

    <p class="text-center text-xs text-gray-400 dark:text-gray-500 mt-6">
      Polski Związek Wędkarski — System Obsługi Zawodów
    </p>
  </div>
</div>
{% endblock %}
